name: PubMed Update

on:
  schedule:
    - cron: "17 6 * * *"  # Check daily; Config determines when a report is due.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the configured Google Sheet (leave off for a dry run)"
        type: boolean
        default: false
      start_date:
        description: "Optional report start: YYYY-MM-DD"
        type: string
      end_date:
        description: "Optional report end: YYYY-MM-DD (requires start)"
        type: string
      report_quarter:
        description: "Optional report quarter: YYYY-Qn"
        type: string
      themes:
        description: "Enable optional Gemini themes for this run"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pubmed-publication-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
      - name: Install tested dependencies
        run: python -m pip install -r requirements.txt -c requirements.lock
      - name: Run regression tests before collection
        run: python -m unittest discover -s tests -v
      - name: Check email scheduling with mocked Google services
        run: node tests/test_email.js
      - name: Install optional Gemini support when a key is configured
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            python -m pip install -r requirements-ai.txt -c requirements.lock
          fi
      - name: Collect and report publications
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          REPORT_QUARTER: ${{ inputs.report_quarter }}
          ENABLE_THEMES: ${{ inputs.themes }}
        shell: bash
        run: |
          args=()
          if [ "$SCHEDULED" = "true" ]; then args+=(--scheduled); fi
          if [ "$PUBLISH" = "true" ]; then args+=(--publish); else args+=(--dry-run); fi
          if [ -n "$START_DATE" ]; then args+=(--start "$START_DATE"); fi
          if [ -n "$END_DATE" ]; then args+=(--end "$END_DATE"); fi
          if [ -n "$REPORT_QUARTER" ]; then args+=(--quarter "$REPORT_QUARTER"); fi
          if [ "$ENABLE_THEMES" = "true" ]; then args+=(--themes); fi
          python src/script.py "${args[@]}"
      # This repository is public. Private sheet snapshots and review notes should
      # stay in Sheets unless the owner intentionally opts into artifact uploads.
      - name: Save reports and recovery snapshot (opt-in)
        if: ${{ always() && vars.UPLOAD_REPORT_ARTIFACTS == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: pubmed-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/
            logs/
          if-no-files-found: ignore
          retention-days: 30
